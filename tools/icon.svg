<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MC6: the face of Minecraft's creeper in 8x8 pixels on its mottled green, with the gloss of an iOS 6 icon (full
       bleed: the corners are cut by tools/gen_assets.py). Drawn here; the creeper is Mojang's. -->
  <defs>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#4fae3c"/>
  <!-- the skin's pixels: a grid of 8x8, 112 each, from 64 -->
  <g fill="#66c851">
    <rect x="64" y="64" width="112" height="112"/>
    <rect x="400" y="64" width="112" height="112"/>
    <rect x="736" y="176" width="112" height="112"/>
    <rect x="64" y="512" width="112" height="112"/>
    <rect x="848" y="400" width="112" height="112"/>
    <rect x="176" y="736" width="112" height="112"/>
    <rect x="736" y="736" width="112" height="112"/>
    <rect x="512" y="176" width="112" height="112"/>
    <rect x="848" y="848" width="112" height="112"/>
  </g>
  <g fill="#3c8f2d">
    <rect x="288" y="64" width="112" height="112"/>
    <rect x="624" y="64" width="112" height="112"/>
    <rect x="848" y="176" width="112" height="112"/>
    <rect x="64" y="288" width="112" height="112"/>
    <rect x="400" y="288" width="112" height="112"/>
    <rect x="176" y="624" width="112" height="112"/>
    <rect x="736" y="512" width="112" height="112"/>
    <rect x="64" y="848" width="112" height="112"/>
    <rect x="512" y="400" width="112" height="112"/>
    <rect x="848" y="624" width="112" height="112"/>
  </g>
  <!-- the face: eyes, mouth -->
  <g fill="#141414">
    <rect x="176" y="288" width="224" height="224"/>
    <rect x="624" y="288" width="224" height="224"/>
    <rect x="400" y="512" width="224" height="112"/>
    <rect x="288" y="624" width="448" height="224"/>
    <rect x="288" y="848" width="112" height="112"/>
    <rect x="624" y="848" width="112" height="112"/>
  </g>
  <path d="M0,0 H1024 V430 C760,500 264,500 0,430 Z" fill="url(#gloss)"/>
</svg>
