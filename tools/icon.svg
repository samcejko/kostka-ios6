<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Kostka: a cube of blocks on a dark tile, with the gloss of an iOS 6 icon (full bleed: the corners are cut by
       tools/gen_assets.py). Our own drawing, nothing of Mojang's. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3d52"/>
      <stop offset="1" stop-color="#0c131b"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3d3e2"/>
      <stop offset="1" stop-color="#93a8bd"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c90a6"/>
      <stop offset="1" stop-color="#5d7085"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55677b"/>
      <stop offset="1" stop-color="#3a4858"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="905" rx="330" ry="52" fill="#000000" opacity="0.35"/>
  <polygon points="512,190 812,363 512,536 212,363" fill="url(#top)"/>
  <polygon points="212,363 512,536 512,882 212,709" fill="url(#left)"/>
  <polygon points="512,536 812,363 812,709 512,882" fill="url(#right)"/>
  <g stroke="#1d2836" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round">
    <line x1="612" y1="247.7" x2="312" y2="420.7"/>
    <line x1="712" y1="305.3" x2="412" y2="478.3"/>
    <line x1="412" y1="247.7" x2="712" y2="420.7"/>
    <line x1="312" y1="305.3" x2="612" y2="478.3"/>
    <line x1="212" y1="478.3" x2="512" y2="651.3"/>
    <line x1="212" y1="593.7" x2="512" y2="766.7"/>
    <line x1="312" y1="420.7" x2="312" y2="766.7"/>
    <line x1="412" y1="478.3" x2="412" y2="824.3"/>
    <line x1="512" y1="651.3" x2="812" y2="478.3"/>
    <line x1="512" y1="766.7" x2="812" y2="593.7"/>
    <line x1="612" y1="478.3" x2="612" y2="824.3"/>
    <line x1="712" y1="420.7" x2="712" y2="766.7"/>
  </g>
  <g fill="none" stroke="#0f1620" stroke-width="12" stroke-linejoin="round">
    <polygon points="512,190 812,363 812,709 512,882 212,709 212,363"/>
    <polyline points="212,363 512,536 812,363"/>
    <line x1="512" y1="536" x2="512" y2="882"/>
  </g>
  <path d="M0,0 H1024 V430 C760,500 264,500 0,430 Z" fill="url(#gloss)"/>
</svg>
