name: Build Kostka (iOS 6 armv7 + iOS 14 arm64)

on:
  push:
    branches: ['**']   # not for tags, a release tag points at a commit that was already built
  pull_request:
  workflow_dispatch:

# The build only reads the repository (and the Java runtime built by jre.yml); nothing here needs a write token.
permissions:
  contents: read
  actions: read

env:
  THEOS: /home/runner/theos
  # Theos + toolchain + the iOS 9.3 and 16.5 SDKs (bump when any of them changes)
  THEOS_CACHE_KEY: theos-linux-clang11-sdk93-sdk165-v2

jobs:
  build:
    # One source tree, two packages: armv7 for iOS 6 (Cydia, ipainstaller) and arm64 for iOS 14-17 (the .deb for
    # rootless jailbreaks, the IPA for TrollStore). THEOS_PACKAGE_SCHEME=rootless selects the latter in the Makefile.
    # The Java runtime and LWJGL exist for armv7 only (jre.yml, lwjgl.yml): the arm64 launcher is built without them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ios6-armv7
            scheme: ""
            suffix: ""
            arch: armv7
            artifact: Kostka-packages
          - name: ios14-arm64
            scheme: rootless
            suffix: "-arm64"
            arch: arm64
            artifact: Kostka-packages-arm64
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl zip unzip git libxml2 xz-utils python3-pil fonts-dejavu-core librsvg2-bin libplist-utils libtinfo5 || \
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl zip unzip git libxml2 xz-utils python3-pil fonts-dejavu-core librsvg2-bin libplist-utils

      - name: Restore Theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: ${{ env.THEOS_CACHE_KEY }}

      - name: Install Theos, toolchain and the iOS 9.3 and 16.5 SDKs
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain" "$THEOS/sdks"
          curl -sSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            CLANG=$(find "$THEOS/toolchain" -type f -name clang -path '*/bin/*' | head -n1)
            ROOT=$(dirname "$(dirname "$CLANG")")
            mkdir -p "$THEOS/toolchain/linux"
            ln -sfn "$ROOT" "$THEOS/toolchain/linux/iphone"
          fi
          RELEASE=$(curl -sS https://api.github.com/repos/theos/sdks/releases/latest)
          for SDK in 9.3 16.5; do
            SDK_URL=$(echo "$RELEASE" | grep -o "https://[^\"]*iPhoneOS${SDK}\.sdk[^\"]*" | head -n1 || true)
            if [ -n "$SDK_URL" ]; then
              curl -sSL "$SDK_URL" -o /tmp/sdk.archive
              (tar -xJf /tmp/sdk.archive -C "$THEOS/sdks/" 2>/dev/null || tar -xzf /tmp/sdk.archive -C "$THEOS/sdks/" 2>/dev/null || unzip -q /tmp/sdk.archive -d "$THEOS/sdks/")
            fi
            if [ ! -d "$THEOS/sdks/iPhoneOS${SDK}.sdk" ]; then
              rm -rf /tmp/sdks
              git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
              (cd /tmp/sdks && git sparse-checkout set "iPhoneOS${SDK}.sdk")
              mv "/tmp/sdks/iPhoneOS${SDK}.sdk" "$THEOS/sdks/"
            fi
          done
          ls "$THEOS/sdks"

      - name: Toolchain diagnostics
        run: |
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          which clang ld64 ldid || true
          clang --version || true

      - name: Patch SDK (stub re-exported libraries missing from theos/sdks)
        run: |
          set -e
          TBIN="$THEOS/toolchain/linux/iphone/bin"
          if [ -x /usr/bin/plistutil ]; then ln -sf /usr/bin/plistutil "$TBIN/plistutil"; fi
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          LIBSYS="$SDK/usr/lib/libSystem.tbd"
          test -f "$LIBSYS"
          for lib in $(grep -o "/usr/lib/system/lib[A-Za-z0-9_]*\.dylib" "$LIBSYS" | sort -u); do
            base="${lib%.dylib}"
            if [ ! -f "$SDK$base.tbd" ] && [ ! -f "$SDK$lib" ]; then
              mkdir -p "$(dirname "$SDK$base.tbd")"
              printf -- '---\narchs:           [ armv7, armv7s, arm64 ]\nplatform:        ios\ninstall-name:    %s\ncurrent-version: 1.0\ncompatibility-version: 1.0\nexports:\n  - archs:           [ armv7, armv7s, arm64 ]\n    symbols:         [ ]\n...\n' "$lib" > "$SDK$base.tbd"
              echo "stubbed $lib"
            fi
          done
          LIBC="$SDK/usr/lib/system/libsystem_c.tbd"
          ADD=""
          for sym in _memcpy _memset _memmove _memcmp _memchr _strchr _strcmp _strncmp _strlen _strnlen _bzero \
                     _strcpy _strncpy _strcat _strlcpy _strlcat _strstr _strrchr _strdup _memset_s _memset_pattern4 \
                     _memset_pattern8 _memset_pattern16 _strncasecmp _strcasecmp; do
            if ! grep -Eq "[[ ,]${sym}[], ]" "$LIBC" "$SDK/usr/lib/system/libsystem_platform.tbd"; then
              ADD="${ADD}${sym}, "
            fi
          done
          if [ -n "$ADD" ]; then
            echo "adding to libsystem_c.tbd: $ADD"
            sed -i "0,/symbols:            \[ /s//symbols:            [ ${ADD}/" "$LIBC"
          fi

      - name: Generate icons and launch images
        run: python3 tools/gen_assets.py Resources

      - name: Fetch the JNI headers (OpenJDK 8, GPL v2 with the Classpath exception)
        run: |
          set -e
          mkdir -p vendor/fetched/jni
          BASE=https://raw.githubusercontent.com/openjdk/aarch32-port-jdk8u/jdk8u504-ga-aarch32-20260819/jdk/src
          curl -sSfL "$BASE/share/javavm/export/jni.h" -o vendor/fetched/jni/jni.h
          curl -sSfL "$BASE/solaris/javavm/export/jni_md.h" -o vendor/fetched/jni/jni_md.h
          grep -c JNI_CreateJavaVM vendor/fetched/jni/jni.h

      - name: Java test programs
        run: |
          set -e
          JAVAC="${JAVA_HOME_8_X64:-$JAVA_HOME}/bin/javac"
          mkdir -p /tmp/javatest Resources/test
          "$JAVAC" -source 1.8 -target 1.8 -d /tmp/javatest jvm/test/*.java
          (cd /tmp/javatest && "${JAVA_HOME_8_X64:-$JAVA_HOME}/bin/jar" cf "$GITHUB_WORKSPACE/Resources/test/hello.jar" .)
          ls -la Resources/test

      - name: Kostka's Java helpers (OptiFine's installer without its window)
        run: |
          set -e
          JAVAC="${JAVA_HOME_8_X64:-$JAVA_HOME}/bin/javac"
          mkdir -p /tmp/javahelpers Resources/java
          "$JAVAC" -source 1.8 -target 1.8 -d /tmp/javahelpers src/Java/helpers/*.java
          (cd /tmp/javahelpers && "${JAVA_HOME_8_X64:-$JAVA_HOME}/bin/jar" cf "$GITHUB_WORKSPACE/Resources/java/kostka-helpers.jar" .)
          ls -la Resources/java

      # (the runtime and LWJGL exist for armv7 only: the arm64 job finds no jre-ios-arm64 / lwjgl-ios-arm64 artifact
      # and builds the launcher without them)
      - name: The Java runtime (the latest successful build of jre.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow jre.yml --status success --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$RUN" ] && gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n "jre-ios-${{ matrix.arch }}" -D Resources/jre; then
            echo "runtime from run $RUN"
            find Resources/jre -maxdepth 3 | head -n 40
            du -sh Resources/jre
          else
            rm -rf Resources/jre
            echo "no ${{ matrix.arch }} runtime built yet: the app is built without one"
          fi

      - name: LWJGL with gl4es (the latest successful build of lwjgl.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow lwjgl.yml --status success --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$RUN" ] && gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n "lwjgl-ios-${{ matrix.arch }}" -D Resources/lwjgl; then
            echo "LWJGL from run $RUN"
            ls -la Resources/lwjgl
          else
            rm -rf Resources/lwjgl
            echo "no ${{ matrix.arch }} LWJGL built yet: the app is built without it"
          fi

      - name: Syntax check (every error of our own sources in one go)
        run: |
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          if [ "${{ matrix.arch }}" = arm64 ]; then SDK="$THEOS/sdks/iPhoneOS16.5.sdk"; TRIPLE=arm64-apple-ios14.0; else SDK="$THEOS/sdks/iPhoneOS9.3.sdk"; TRIPLE=armv7-apple-ios6.0; fi
          FLAGS="-target $TRIPLE -isysroot $SDK -fsyntax-only -w -ferror-limit=0 -Isrc -Isrc/Probe -Isrc/Java -Isrc/UI -Isrc/Util -Isrc/Launcher -Ivendor/fetched/jni"
          status=0
          for f in $(find src -name '*.m' | sort); do
            clang $FLAGS -fobjc-arc -x objective-c "$f" 2>&1 | grep -E 'error:' && status=1
          done
          for f in $(find src -name '*.c' | sort); do
            clang $FLAGS -x c "$f" 2>&1 | grep -E 'error:' && status=1
          done
          if [ $status -ne 0 ]; then echo "SYNTAX CHECK FOUND ERRORS (see above)"; else echo "syntax check clean"; fi

      - name: Build (${{ matrix.name }})
        run: |
          set -o pipefail
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          if [ -n "${{ matrix.scheme }}" ]; then export THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}"; fi
          make clean || true
          make package FINALPACKAGE=1 -j"$(nproc)" -k 2>&1 | tee build.log
          APP=$(find .theos/_ -type d -name Kostka.app | head -n1)
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "== staged app ($APP) =="
          ls -la "$APP"
          lipo -info "$APP/Kostka" 2>/dev/null || true

      - name: Make IPA
        run: |
          set -e
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          echo "app: $APP"
          LDID=$(command -v ldid || find "$THEOS" -type f -name ldid | head -n1)
          "$LDID" -S"$GITHUB_WORKSPACE/entitlements.xml" "$APP/Kostka"
          "$LDID" -e "$APP/Kostka" | head -n 20
          VERSION=$(grep '^Version:' control | cut -d' ' -f2)
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload packages
          cp -a "$APP" /tmp/ipa/Payload/
          (cd /tmp/ipa && zip -qr9 "$GITHUB_WORKSPACE/packages/Kostka-$VERSION${{ matrix.suffix }}.ipa" Payload)
          ls -la packages/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            packages/*.ipa
            packages/*.deb
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: build.log
          if-no-files-found: ignore
